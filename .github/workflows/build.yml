name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk HabitTracker.apk

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-apk
          path: HabitTracker.apk

      # Puts the APK at a fixed link you can open on your phone:
      # https://github.com/<you>/<repo>/releases/latest/download/HabitTracker.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (#${{ github.run_number }})
          body: Built from ${{ github.sha }}. Download HabitTracker.apk below and open it to install.
          files: HabitTracker.apk
          make_latest: true
